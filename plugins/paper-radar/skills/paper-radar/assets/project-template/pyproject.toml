[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-radar"
version = "0.1.0"
description = "Weekly paper radar for embodied perception research."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "pypdf>=5",
  "requests>=2.31",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
